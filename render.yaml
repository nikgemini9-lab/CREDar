services:
  - type: web
    name: credar
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: POLL_INTERVAL_MS
        value: "30000"
      - key: RETTIWT_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SEARCH_TERMS
        sync: false
      - key: DEMO_MODE
        sync: false
